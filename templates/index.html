<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">🎓 Student Management System</h2>

    <!-- Add Form -->
    <div class="card p-4 mb-4 shadow">
        <h4>Add Student</h4>
        <form action="/add" method="POST">
            <div class="mb-3">
                <input type="text" name="name" class="form-control" placeholder="Enter Name" required>
            </div>

            <div class="mb-3">
                <input type="number" name="age" class="form-control" placeholder="Enter Age" required>
            </div>

            <div class="mb-3">
                <input type="text" name="department" class="form-control" placeholder="Enter Department" required>
            </div>

            <button class="btn btn-primary">Add Student</button>
        </form>
    </div>

    <!-- Table -->
    <div class="card p-4 shadow">
        <h4>Students List</h4>

        <table class="table table-bordered table-hover mt-3">
            <tr class="table-dark">
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>
                <td>
                    <a href="/edit/{{ student[0] }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete/{{ student[0] }}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

</body>
</html>
