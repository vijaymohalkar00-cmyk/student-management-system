<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🎓 Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <!-- DASHBOARD -->
    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card text-white bg-primary p-3">
                <h5>Total Students</h5>
                <h2>{{ total }}</h2>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-3">
                <h5>Department-wise Students</h5>
                <ul>
                    {% for dept in dept_data %}
                    <li>{{ dept[0] }} : {{ dept[1] }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>

    </div>

    <!-- SEARCH -->
    <form action="/search" method="POST" class="mb-3">
        <input type="text" name="keyword" class="form-control" placeholder="Search by name">
    </form>

    <!-- ADD -->
    <div class="card p-3 mb-4">
        <h4>Add Student</h4>
        <form action="/add" method="POST">
            <input class="form-control mb-2" type="text" name="name" required>
            <input class="form-control mb-2" type="number" name="age" required>
            <input class="form-control mb-2" type="text" name="department" required>
            <button class="btn btn-success">Add</button>
        </form>
    </div>

    <!-- TABLE -->
    <div class="card p-3">
        <table class="table table-bordered">
            <tr class="table-dark">
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

            {% for s in students %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[3] }}</td>
                <td>
                    <a href="/edit/{{ s[0] }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete/{{ s[0] }}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

</body>
</html>
