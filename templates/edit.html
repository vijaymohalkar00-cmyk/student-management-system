<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">
        <h3 class="mb-3">✏️ Edit Student</h3>

        <form action="/update/{{ student[0] }}" method="POST">

            <div class="mb-3">
                <input type="text" name="name" class="form-control" value="{{ student[1] }}" required>
            </div>

            <div class="mb-3">
                <input type="number" name="age" class="form-control" value="{{ student[2] }}" required>
            </div>

            <div class="mb-3">
                <input type="text" name="department" class="form-control" value="{{ student[3] }}" required>
            </div>

            <button class="btn btn-success">Update</button>
            <a href="/" class="btn btn-secondary">Back</a>

        </form>
    </div>

</div>

</body>
</html>
