<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2>Edit Student</h2>

    <form action="/update/{{ student[0] }}" method="POST">
        <input class="form-control mb-2" type="text" name="name" value="{{ student[1] }}" required>
        <input class="form-control mb-2" type="number" name="age" value="{{ student[2] }}" required>
        <input class="form-control mb-2" type="text" name="department" value="{{ student[3] }}" required>
        <button class="btn btn-success">Update</button>
    </form>

</div>

</body>
</html>
